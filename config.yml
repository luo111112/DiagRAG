milvus:
  host: ${MILVUS_HOST:-localhost}
  port: ${MILVUS_PORT:-19530}
  collection_name: medical_chunks
  vector_dim: 1536

embedding:
  model: text-embedding-v1
  dashscope_api_key: ${DASHSCOPE_API_KEY}

llm:
  model: "qwen-max"
  temperature: 0.1
  max_tokens: 1500
  dashscope_api_key: ${DASHSCOPE_API_KEY}

retrieval:
  top_k: 5
  score_threshold: 0.0
  # 查询预处理配置
  enable_query_preprocess: false          # 是否启用查询预处理（normalize / standardize / rewrite / expand）
  # Query 改写（LLM 调用）
  enable_query_rewrite: false             # 是否启用 LLM 查询改写（生成 1-2 个更清晰的变体）
  max_rewrite_variants: 2                # 最多生成的改写变体数量
  # Query 扩展（LLM 调用）
  enable_query_expand: false             # 是否启用 LLM 查询扩展（生成相关医学术语）
  max_expand_terms: 4                    # 最多生成的扩展词数量
  # Reranker 配置
  enable_rerank: false                    # 是否在检索后启用重排序
  rerank_top_k: 3                         # 重排序后传给 LLM 的最终文档数（应 <= top_k）
  rerank_mode: "score"                    # LLM 评分模式：rank=仅排序 / score=数值评分 / score_with_reason=评分+理由
  enable_bm25_blend: false               # 是否启用 BM25 混合重排序（与 LLM 融合）
  rerank_fusion: "rrf"                   # 融合策略：rrf=倒数排名融合 / linear=线性加权
  max_docs_per_call: 10                   # 单次 LLM 调用最多处理的文档数（控制 token 消耗）

chunking:
  chunk_size: 500
  chunk_overlap: 50
  min_chunk_length: 20

# 元数据过滤配置：根据文档元数据字段筛检索结果
metadata_filter:
  enabled: false
  # 过滤模式：
  #   "whitelist" — 仅保留 metadata 中指定字段值匹配的文档（交集）
  #   "blacklist" — 排除匹配 blacklist 中任意一项的文档
  mode: "whitelist"
  # 白名单规则：key=metadata 字段名，value=允许的值列表（任一匹配即可）
  # 支持从环境变量引用：使用 ${VAR} 语法
  whitelist:
    # source_file: ["急性心肌梗死诊疗指南", "糖尿病防治指南"]
    # disease_type: ["急性心肌梗死"]
  # 黑名单规则：key=metadata 字段名，value=排除的值列表
  blacklist:
    # source_file: ["测试文档"]

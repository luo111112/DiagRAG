milvus:
  host: ${MILVUS_HOST:-localhost}
  port: ${MILVUS_PORT:-19530}
  collection_name: medical_chunks
  vector_dim: 1536

embedding:
  model: text-embedding-v1
  dashscope_api_key: ${DASHSCOPE_API_KEY}

llm:
  model: "qwen-max"
  temperature: 0.1
  max_tokens: 1500
  dashscope_api_key: ${DASHSCOPE_API_KEY}

retrieval:
  top_k: 5
  score_threshold: 0.0
  # 查询预处理配置
  enable_query_preprocess: false          # 是否启用查询预处理（normalize / standardize / rewrite / expand）
  # Query 改写（LLM 调用）
  enable_query_rewrite: false             # 是否启用 LLM 查询改写（生成 1-2 个更清晰的变体）
  max_rewrite_variants: 2                # 最多生成的改写变体数量
  # Query 扩展（LLM 调用）
  enable_query_expand: false             # 是否启用 LLM 查询扩展（生成相关医学术语）
  max_expand_terms: 4                    # 最多生成的扩展词数量
  # Reranker 配置
  enable_rerank: false                    # 是否在检索后启用重排序
  rerank_top_k: 3                         # 重排序后传给 LLM 的最终文档数（应 <= top_k）
  rerank_mode: "score"                    # LLM 评分模式：rank=仅排序 / score=数值评分 / score_with_reason=评分+理由
  enable_bm25_blend: false               # 是否启用 BM25 混合重排序（与 LLM 融合）
  rerank_fusion: "rrf"                   # 融合策略：rrf=倒数排名融合 / linear=线性加权
  max_docs_per_call: 10                   # 单次 LLM 调用最多处理的文档数（控制 token 消耗）

chunking:
  chunk_size: 500
  chunk_overlap: 50
  min_chunk_length: 20

# 元数据过滤配置：根据文档元数据字段筛检索结果
metadata_filter:
  enabled: false
  # 过滤模式：
  #   "whitelist" — 仅保留 metadata 中指定字段值匹配的文档（交集）
  #   "blacklist" — 排除匹配 blacklist 中任意一项的文档
  mode: "whitelist"
  # 白名单规则：key=metadata 字段名，value=允许的值列表（任一匹配即可）
  # 支持从环境变量引用：使用 ${VAR} 语法
  whitelist:
    # source_file: ["急性心肌梗死诊疗指南", "糖尿病防治指南"]
    # disease_type: ["急性心肌梗死"]
  # 黑名单规则：key=metadata 字段名，value=排除的值列表
  blacklist:
    # source_file: ["测试文档"]

# 对话历史（长中短期记忆）配置
conversation:
  redis:
    host: ${REDIS_HOST:-localhost}
    port: ${REDIS_PORT:-6379}
    db: 0
    password: ${REDIS_PASSWORD:-}
  mysql:
    host: ${MYSQL_HOST:-localhost}
    port: ${MYSQL_PORT:-3306}
    user: ${MYSQL_USER:-root}
    password: ${MYSQL_PASSWORD:-diagrag123}
    database: ${MYSQL_DATABASE:-diagrag}
    pool_size: 10
    pool_recycle: 3600
  kafka:
    bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    topic: "rag-conversation-events"
    consumer_group: "rag-conversation-consumer"
    acks: "all"
    retries: 3
  # 记忆策略参数
  redis_cache_turns: 10           # Redis 缓存最近多少轮（10轮=20条消息）
  summary_interval_turns: 5       # 每满多少轮触发一次摘要生成
  redis_ttl_days: 7               # Redis 数据过期天数
  mysql_retention_days: 30        # MySQL 数据保留天数（合规）
  # LLM 摘要模型（用 qwen-plus 降成本，不占用 qwen-max 配额）
  summary_llm_model: "qwen-plus"
  summary_llm_temperature: 0.1
  summary_max_tokens: 500

# 语义缓存配置（Semantic Cache）
semantic_cache:
  enabled: true
  # Milvus query_cache Collection 名称
  collection_name: query_cache
  # 语义相似度阈值（向量余弦相似度），超过此值才视为命中
  similarity_threshold: 0.93
  # 上下文指纹匹配阈值（Jaccard 关键词重叠），多轮场景用
  context_threshold: 0.50
  # 缓存过期天数（Milvus TTL）
  ttl_days: 7
  # 最大条目数，超出按 last_hit_at 淘汰最旧记录
  max_entries: 10000
  # 缓存键粒度：session（默认，安全优先）| user | question
  #   session  — question + session_id + summary_hash（推荐）
  #   user     — question + user_id + summary_hash（跨会话复用）
  #   question — 仅 question（最高复用率，多轮场景慎用）
  cache_key_scope: "session"
  # 精确匹配一级缓存（Redis）TTL，单位秒（1小时）
  redis_exact_ttl_seconds: 3600
  # 是否启用精确 SHA256 匹配（Redis 一级缓存）
  enable_exact_match: true
  # 语义搜索返回的候选数量（top_k for Milvus cache search）
  search_top_k: 3
  # 答案最短长度（短于此不写入缓存，避免缓存空/错误答案）
  min_answer_length: 20
  # 来源列表最短条数（少于此不写入缓存）
  min_sources_count: 0
